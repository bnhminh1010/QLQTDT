name: CD - Build Artifacts

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Tests/**'
      - '.github/workflows/cd-artifacts.yml'
      - 'docker-compose.backend.yml'
  workflow_dispatch:
    inputs:
      frontend_api_url:
        description: 'Frontend VITE_BASE_API for the generated dist artifact'
        required: false
        type: string

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'
  PROJECT_PATH: 'backend/QLQTDT.Api.csproj'
  TEST_PROJECT_PATH: 'Tests/QLQTDT.Api.Tests.csproj'
  VITE_BASE_API: ${{ github.event.inputs.frontend_api_url || vars.VITE_BASE_API }}

jobs:
  artifact-build:
    name: Artifact Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            backend/**/*.csproj
            Tests/**/*.csproj
            **/packages.lock.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend API URL
        run: |
          if [ -z "${VITE_BASE_API}" ]; then
            echo "::error::Set repository variable VITE_BASE_API or provide workflow_dispatch input frontend_api_url before building deployable frontend artifacts."
            exit 1
          fi

      - name: Restore backend dependencies
        run: |
          dotnet restore "${{ env.PROJECT_PATH }}" --locked-mode
          dotnet restore "${{ env.TEST_PROJECT_PATH }}" --locked-mode

      - name: Build backend
        run: dotnet build "${{ env.TEST_PROJECT_PATH }}" --no-restore --configuration Release --no-incremental

      - name: Run backend tests
        run: dotnet test "${{ env.TEST_PROJECT_PATH }}" --no-build --configuration Release

      - name: Publish backend IIS artifact
        run: dotnet publish "${{ env.PROJECT_PATH }}" --no-restore --configuration Release --output artifacts/backend-publish

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend artifact
        working-directory: frontend
        run: npm run build

      - name: Install EF Core CLI
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.8
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate migration review script
        env:
          ASPNETCORE_ENVIRONMENT: Production
          DB_SERVER: localhost
          DB_USER: ci
          DB_PASSWORD: ci-password
          DB_NAME: QLQTDT_CI
          DB_ENCRYPT: 'false'
          DB_TRUST_SERVER_CERTIFICATE: 'true'
          JWT_SECRET: ci-artifact-only-secret-000000000000000000000000
          JWT_ISSUER: QLQTDT
          JWT_AUDIENCE: QLQTDT.Frontend
          FTP_SERVER: ci.invalid
          FTP_PORT: '21'
          FTP_USER: ci
          FTP_PASSWORD: ci-password
          FTP_BASE_PATH: /qlqtdt/uploads
          FTP_ENCRYPTION_MODE: None
          FTP_USE_PASSIVE: 'true'
          CORS_ORIGINS: http://localhost:5173
          RUN_STARTUP_SEED: 'false'
        run: |
          mkdir -p artifacts
          dotnet ef migrations script --idempotent --no-build --project "${{ env.PROJECT_PATH }}" --startup-project "${{ env.PROJECT_PATH }}" --configuration Release --output artifacts/migration-review.sql

      - name: Package artifacts
        run: |
          cd artifacts/backend-publish
          zip -r ../backend-iis-publish.zip .
          cd ../..
          cd frontend/dist
          zip -r ../../artifacts/frontend-dist.zip .
          cd ../..
          sha256sum artifacts/backend-iis-publish.zip artifacts/frontend-dist.zip artifacts/migration-review.sql > artifacts/checksums.sha256

      - name: Write release manifest
        run: |
          cat > artifacts/release-manifest.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "branch": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}",
            "createdAtUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "frontendBaseApi": "${VITE_BASE_API}",
            "artifacts": [
              "backend-iis-publish.zip",
              "frontend-dist.zip",
              "migration-review.sql",
              "checksums.sha256"
            ],
            "requiredRuntimeEnvironment": [
              "DB_SERVER",
              "DB_USER",
              "DB_PASSWORD",
              "DB_NAME",
              "JWT_SECRET",
              "JWT_ISSUER",
              "JWT_AUDIENCE",
              "FTP_SERVER",
              "FTP_PORT",
              "FTP_USER",
              "FTP_PASSWORD",
              "FTP_BASE_PATH",
              "CORS_ORIGINS"
            ]
          }
          EOF

      - name: Verify no env file in backend publish
        run: |
          if find artifacts/backend-publish -maxdepth 1 -name '.env' | grep -q .; then
            echo "::error::.env must not be included in backend publish artifact."
            exit 1
          fi

      - name: Upload backend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-iis-publish
          path: artifacts/backend-iis-publish.zip
          retention-days: 14

      - name: Upload frontend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: artifacts/frontend-dist.zip
          retention-days: 14

      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-metadata
          path: |
            artifacts/migration-review.sql
            artifacts/checksums.sha256
            artifacts/release-manifest.json
          retention-days: 14
